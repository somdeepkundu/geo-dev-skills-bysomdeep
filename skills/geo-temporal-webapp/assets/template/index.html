<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; worker-src 'self'">
<meta name="theme-color" content="#1f4d3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
<title>Event Timeline</title>
</head>
<body>
<header class="top">
  <div>
    <p class="eyebrow" id="zoneLabel">&nbsp;</p>
    <h1 id="eventName">Event</h1>
  </div>
  <div class="clock" aria-live="off">
    <span id="clockNow">--:--</span>
    <small id="clockMode">local to event</small>
  </div>
</header>

<div class="banner" id="demoBanner" hidden></div>

<section class="playhead" aria-label="Time">
  <div class="ph-head">
    <span id="phTime">--:--</span>
    <span class="ph-mode" id="phMode">Following now</span>
    <button type="button" id="nowBtn" class="btn ghost" disabled>Now</button>
  </div>
  <div class="track" id="track" role="slider" tabindex="0" aria-label="Event time" aria-valuetext="">
    <div class="track-bars" id="trackBars"></div>
    <div class="thumb" id="thumb"></div>
  </div>
  <div class="ticks" id="ticks"></div>
  <p class="hint">Drag, or use the arrow keys (Shift for 30 minutes, Page keys for an hour).</p>
</section>

<main class="grid">
  <section class="list" aria-label="Items">
    <h2 class="sr-only">Items</h2>
    <ul id="items"></ul>
  </section>
  <section class="map-wrap" aria-label="Map">
    <div id="map" role="region" aria-label="Map of event items"></div>
    <div class="legend" id="legend"></div>
  </section>
</main>

<footer class="foot">
  <span id="footNote"></span>
</footer>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="lib/timekit.js"></script>
<script src="lib/georef.js"></script>
<script src="lib/explorer-kit.js"></script>
<script src="app.js"></script>
</body>
</html>
